name: ${COMPOSE_PROJECT_NAME:-inventory-dev}

services:
  mysql:
    image: mysql:8.4.9
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: inventory
      MYSQL_PASSWORD_FILE: /run/secrets/app_db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./infra/mysql/healthcheck.sh:/opt/healthcheck.sh:ro
    secrets:
      - mysql_root_password
      - app_db_password
      - keycloak_db_password
    healthcheck:
      test: ["CMD", "sh", "/opt/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    entrypoint: ["/bin/bash", "/opt/bootstrap/entrypoint.sh"]
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak?sslMode=DISABLED&connectionTimeZone=UTC
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-bootstrap-admin}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8081}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_LOG_CONSOLE_OUTPUT: json
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
      - "127.0.0.1:${KEYCLOAK_MANAGEMENT_PORT:-9000}:9000"
    volumes:
      - ./infra/keycloak/entrypoint.sh:/opt/bootstrap/entrypoint.sh:ro
      - ./infra/keycloak/healthcheck.sh:/opt/bootstrap/healthcheck.sh:ro
      - ./infra/keycloak/realm-inventory-dev.json:/opt/keycloak/data/import/realm-inventory-dev.json:ro
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "/opt/bootstrap/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    logging: *logging

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/inventory?sslMode=DISABLED&connectionTimeZone=UTC
      DB_USERNAME: inventory
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8081/realms/inventory-dev}
      OIDC_DISCOVERY_URI: http://keycloak:8080/realms/inventory-dev/.well-known/openid-configuration
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - app_db_password
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 40s
    logging: *logging

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *logging

volumes:
  mysql_data:

secrets:
  mysql_root_password:
    file: ./.secrets/mysql_root_password
  app_db_password:
    file: ./.secrets/app_db_password
  keycloak_db_password:
    file: ./.secrets/keycloak_db_password
  keycloak_admin_password:
    file: ./.secrets/keycloak_admin_password
