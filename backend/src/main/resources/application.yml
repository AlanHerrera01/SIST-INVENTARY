spring:
  application:
    name: inventory-backend
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/inventory?sslMode=DISABLED&connectionTimeZone=UTC}
    username: ${DB_USERNAME:inventory}
    password: ${DB_PASSWORD:${app_db_password}}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
      initialization-fail-timeout: 1
  sql:
    init:
      mode: never
  flyway:
    locations: classpath:db/migration
    community-db-support-enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,keycloak
app:
  identity:
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/inventory-dev}
    discovery-uri: ${OIDC_DISCOVERY_URI:${app.identity.issuer-uri}/.well-known/openid-configuration}
logging:
  level:
    root: ${LOG_LEVEL:INFO}
  structured:
    format:
      console: logstash

